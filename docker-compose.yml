services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medilink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-medilink}
    ports:
      - "${POSTGRES_PORT:-5540}:5432"
    volumes:
      - medilink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medilink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medilink}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-medilink}
      # Pas de pooler en dev : DIRECT_URL pointe vers la même connexion que
      # DATABASE_URL (requis par schema.prisma pour les commandes `prisma
      # migrate`, voir le commentaire dans schema.prisma).
      DIRECT_URL: postgresql://${POSTGRES_USER:-medilink}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-medilink}
      API_PORT: ${API_PORT:-4000}
      NODE_ENV: development
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/workspace/apps/api
      - /workspace/apps/api/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health/db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      WEB_PORT: ${WEB_PORT:-3000}
      # Le montage ./apps/web ne propage pas toujours les évènements fs vers
      # le conteneur (observé sous Docker Desktop/Windows) : sans le
      # polling, Next.js peut continuer à servir une version compilée
      # obsolète après une modification faite sur l'hôte.
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next
    healthcheck:
      # `next dev` compile ses pages à la demande (contrairement à `next
      # start` en production, qui sert des pages déjà construites) : le tout
      # premier appel à "/" peut dépasser plusieurs secondes le temps que la
      # page se compile — un timeout de 5s (suffisant en production, voir
      # docker-compose.prod.yml) déclencherait de faux échecs en dev.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  # Capture SMTP locale pour tester réellement l'envoi d'emails (étape 14)
  # sans dépendre d'un vrai fournisseur. Jamais démarré par un simple
  # `docker compose up` : uniquement avec `docker compose --profile mail up`.
  # Ne devient jamais une dépendance obligatoire de production — sans
  # SMTP_HOST défini, l'API utilise un transport "no-op" (voir
  # apps/api/src/plugins/email-transport.ts). Pour l'utiliser, définir
  # SMTP_HOST=mailpit dans apps/api/.env (repris via le volume monté).
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web + API REST (http://localhost:8025)

volumes:
  medilink_postgres_data:
