# Pile de PRODUCTION (étape 16) — distincte de docker-compose.yml (dev).
# Différences volontaires par rapport au fichier de développement :
#   - images construites depuis *.Dockerfile.prod (build réel, pas de
#     `tsx watch`/`next dev`, aucun volume de source) ;
#   - NODE_ENV=production partout (active `secure` sur le cookie de refresh
#     et le comportement de production de Next.js) ;
#   - PostgreSQL n'est jamais publié sur l'hôte (pas de `ports:`) ;
#   - CORS_ORIGIN, JWT_ACCESS_SECRET, COOKIE_SECRET, NEXT_PUBLIC_API_URL
#     sont exigés explicitement (`${VAR:?message}`) : le démarrage échoue
#     immédiatement et clairement si l'un d'eux est oublié, plutôt que de
#     démarrer silencieusement dans un état non sécurisé ;
#   - aucun service Mailpit : le profil "mail" n'existe pas dans ce fichier.
#
# Ce fichier suppose un déploiement pilote/petite échelle qui containerise
# encore PostgreSQL. Pour un vrai déploiement, un PostgreSQL managé est
# recommandé à la place du service `postgres` ci-dessous (voir
# docs/deployment/README.md) : dans ce cas, ne pas démarrer le service
# `postgres` de ce fichier et pointer `DATABASE_URL` vers l'instance
# managée.
#
# Usage :
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# Variables lues depuis l'environnement du shell ou un fichier ".env" situé
# à côté de ce fichier (mécanisme natif de `docker compose`, distinct des
# ".env" d'application copiés dans les images — jamais fait ici).
#
# `name:` ci-dessous fixe le nom de PROJET Compose à "medilinkai-prod",
# distinct du projet implicite "medilinkai" que `docker-compose.yml` (dev)
# dérive du nom du dossier. Sans cette isolation explicite, les deux
# fichiers partagent le même projet Compose : `container_name` seul ne
# suffit pas à empêcher Compose de recréer/supprimer un conteneur de l'autre
# fichier qu'il perçoit comme appartenant au même emplacement de service
# (constaté concrètement en implémentant cette étape — voir le rapport
# final : le conteneur PostgreSQL de développement a été supprimé, sans
# perte de données grâce à son volume nommé séparé, mais l'incident a
# nécessité une intervention manuelle). Avec `name:` fixé ici, les deux
# piles sont des projets Compose totalement indépendants, quel que soit
# l'ordre de lancement.
name: medilinkai-prod

services:
  postgres:
    image: postgres:16-alpine
    # `container_name` explicite et distinct de `medilinkai-postgres-1`
    # (celui que docker-compose.yml, le fichier de DEV, produit par défaut) :
    # les deux fichiers partagent le même nom de projet implicite (dérivé du
    # nom du dossier) tant qu'aucun `-p`/`--project-name` n'est passé sur la
    # ligne de commande — sans ce nom explicite, lancer cette pile alors que
    # la pile de dev tourne déjà RECRÉE le conteneur `-postgres-1` existant
    # (au lieu d'en créer un second), déconnectant silencieusement la base
    # de développement de son conteneur (les données elles-mêmes restent
    # intactes dans leur volume nommé, mais le conteneur qui les sert est
    # remplacé). Repéré et corrigé pendant l'implémentation de l'étape 16 —
    # voir le rapport final.
    container_name: medilinkai-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medilink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini en production}
      POSTGRES_DB: ${POSTGRES_DB:-medilink}
    # Volontairement AUCUN "ports:" : accessible uniquement depuis le
    # réseau Docker interne (le service "api"), jamais depuis l'hôte ni
    # Internet.
    volumes:
      - medilink_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medilink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile.prod
    # Nom d'image explicite et distinct de `medilinkai-api` (celui que
    # docker-compose.yml, le fichier de DEV, produit par défaut à partir du
    # même nom de dossier) : sans cela, construire cette pile écraserait
    # silencieusement le tag de l'image de développement, et inversement.
    image: medilinkai-api-prod
    container_name: medilinkai-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-medilink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medilink}
      # Pas de pooler avec le service "postgres" local de ce fichier :
      # DIRECT_URL identique à DATABASE_URL (requis par schema.prisma).
      # Pour un vrai PostgreSQL managé (Supabase, recommandé — voir
      # docs/deployment/README.md), DATABASE_URL et DIRECT_URL sont deux
      # valeurs distinctes fournies directement par la plateforme
      # d'hébergement (Render), pas via ce fichier.
      DIRECT_URL: postgresql://${POSTGRES_USER:-medilink}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medilink}
      API_PORT: ${API_PORT:-4000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET doit être défini en production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET doit être défini en production}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN doit être défini en production (domaine réel du frontend)}
      # SMTP optionnel : absent -> transport no-op (aucun email réel envoyé),
      # comportement sûr par défaut si l'envoi d'email n'est pas encore
      # requis pour le pilote.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@medilink.local}
      REMINDER_CHECK_INTERVAL_MS: ${REMINDER_CHECK_INTERVAL_MS:-900000}
    # Port HÔTE fixé à 4001 (distinct du 4000 de docker-compose.yml, dev),
    # pour que les deux piles restent démarrables simultanément sur la même
    # machine. Le port CONTENEUR (4000, ci-dessus dans `environment:`) ne
    # change pas — l'API continue d'écouter sur 4000 à l'intérieur du
    # conteneur, seul le mapping hôte est concerné.
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health/db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL doit être défini en production (URL publique de l'API)}
    # Voir le commentaire équivalent sur le service "api" ci-dessus.
    image: medilinkai-web-prod
    container_name: medilinkai-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WEB_PORT: ${WEB_PORT:-3000}
    # Port HÔTE fixé à 3001 (distinct du 3000 de docker-compose.yml, dev).
    # Voir le commentaire équivalent sur le service "api" ci-dessus : port
    # conteneur (3000) inchangé.
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  medilink_postgres_data_prod:
